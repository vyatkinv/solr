services:

  zookeeper:
    image: zookeeper:3.9
    hostname: zookeeper
    environment:
      ZOO_MY_ID: 1
      ZOO_SERVERS: server.1=zookeeper:2888:3888;2181
      ZOO_4LW_COMMANDS_WHITELIST: "mntr,conf,ruok"
    healthcheck:
      test: ["CMD", "sh", "-c", "echo ruok | nc localhost 2181 | grep imok"]
      interval: 5s
      timeout: 3s
      retries: 10

  solr1:
    build: .
    hostname: solr1
    ports:
      - "8981:8983"
    command: ["start", "-f", "--host", "solr1", "-z", "zookeeper:2181",
              "--jvm-opts", "-Dsolr.host.bind=0.0.0.0 -Dsolr.jetty.http.acceptQueueSize=1000 ${SOLR_EXTRA_JVM_OPTS:-}"]
    depends_on:
      zookeeper:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8983/solr/admin/info/system"]
      interval: 10s
      timeout: 5s
      retries: 18

  solr2:
    build: .
    hostname: solr2
    ports:
      - "8982:8983"
    command: ["start", "-f", "--host", "solr2", "-z", "zookeeper:2181",
              "--jvm-opts", "-Dsolr.host.bind=0.0.0.0 -Dsolr.jetty.http.acceptQueueSize=1000 ${SOLR_EXTRA_JVM_OPTS:-}"]
    depends_on:
      zookeeper:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8983/solr/admin/info/system"]
      interval: 10s
      timeout: 5s
      retries: 18

  solr3:
    build: .
    hostname: solr3
    ports:
      - "8983:8983"
    command: ["start", "-f", "--host", "solr3", "-z", "zookeeper:2181",
              "--jvm-opts", "-Dsolr.host.bind=0.0.0.0 -Dsolr.jetty.http.acceptQueueSize=1000 ${SOLR_EXTRA_JVM_OPTS:-}"]
    depends_on:
      zookeeper:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8983/solr/admin/info/system"]
      interval: 10s
      timeout: 5s
      retries: 18
